name: unicode_perturbation
description: >
  Unicode robustness: the query is corrupted with homoglyph confusables and
  invisible zero-width characters. Visually identical to a human, but the tokens
  no longer match the index, degrading retrieval — a silent failure for
  unicode-naive pipelines.

target:
  name: rag_agent
  params:
    top_k: 3

injectors:
  - name: unicode_perturbation
    intensity: 0.8

steady_state:
  min_correctness: 0.50
  min_overall: 0.50
  max_hijacked_rate: 0.0
  max_p95_latency_ms: 3000

runs: 3
seed: 1337
