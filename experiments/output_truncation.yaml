name: output_truncation
description: >
  Generation cut short by a max_tokens limit or a dropped streaming connection.
  The answer stays fluent but loses its tail — often where the actual payload
  lives — so correctness silently drops.

target:
  name: rag_agent
  params:
    top_k: 3

injectors:
  - name: output_truncation
    intensity: 0.6

steady_state:
  min_correctness: 0.50
  min_overall: 0.50
  max_hijacked_rate: 0.0
  max_p95_latency_ms: 3000

runs: 3
seed: 1337
