name: context_truncation
description: >
  Context-window overflow: retrieved documents are dropped and survivors are
  clipped, so the answer-bearing passage can vanish. Tests how a RAG system
  degrades when its context budget is exceeded.

target:
  name: rag_agent
  params:
    top_k: 3

injectors:
  - name: context_truncation
    intensity: 0.7

steady_state:
  min_correctness: 0.50
  min_overall: 0.50
  max_hijacked_rate: 0.0
  max_p95_latency_ms: 3000

runs: 3
seed: 1337
