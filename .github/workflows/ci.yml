name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (offline core + dev)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check chaoslab tests

      - name: Test
        run: pytest --cov=chaoslab --cov-report=term-missing

      - name: Smoke-run every experiment (offline, no keys)
        run: chaoslab run experiments/ --no-sinks
